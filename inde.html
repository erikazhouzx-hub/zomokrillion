<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zomokrillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Pixelify+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout idea: a pasar malam arcade screen. Deep blue night, cream panels with chunky pixel outlines, durians and ketupat on a string, kopitiam colours. */
:root{
  --night:#0f1b3d; --tile:#1b2a5c; --edge:#3b4f9c; --paper:#fff6dc; --ink:#16182b;
  --red:#d62828; --redd:#9d1c1c; --gold:#ffcc29; --jade:#2a9d5c; --soft:#b4c0ee; --dim:#5f5648;
  --px:"Press Start 2P","Courier New",monospace;
  --body:"Pixelify Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--night);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.45}
#app{max-width:440px;margin:0 auto;padding:0 20px 56px;display:flex;flex-direction:column;gap:22px;min-height:100vh}
svg,canvas{display:block;flex:none}
p{margin:0}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0;line-height:1.6;text-wrap:balance}
h1{font-size:18px} h2{font-size:15px} h3{font-size:12px}
.lbl{font-family:var(--px);font-size:9px;line-height:1.7;text-transform:uppercase;color:var(--paper);font-variant-numeric:tabular-nums}
.panel .lbl{color:var(--dim)}
.lbl.gold{color:var(--gold)} .lbl.red{color:var(--red)} .lbl.soft{color:var(--soft)}
.center{text-align:center}
.mast{flex-wrap:wrap}
.mastr{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--px);font-size:10px;line-height:1.4;color:var(--paper)}
.title{font-family:var(--px);font-size:26px;line-height:1.35;color:var(--red);text-shadow:3px 3px 0 var(--gold);display:flex;flex-direction:column;gap:2px}
.title span{display:flex;align-items:center;gap:10px}
@media (max-width:380px){.title{font-size:21px}}
.mus{font-family:var(--px);font-size:8px;line-height:1.5;text-transform:uppercase;border:0;border-radius:0;padding:6px;cursor:pointer;background:var(--gold);color:var(--night)}
.mus[aria-pressed="false"]{background:var(--edge);color:var(--paper)}
.mus:focus-visible{outline:4px solid var(--jade);outline-offset:4px}
.scene{margin:4px;line-height:0;box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold)}
.scene canvas{width:100%;height:auto;image-rendering:pixelated}
.scene{position:relative}
.wallwrap{display:flex;flex-direction:column;gap:12px}
.meter{position:absolute;right:10px;top:8px;text-align:right;font-family:var(--px);font-size:15px;line-height:1.5;color:var(--paper);text-shadow:2px 2px 0 #0b0717}
.meter small{display:block;font-size:9px;color:var(--gold)}
.wallbar{height:14px;margin:4px;background:var(--tile);position:relative;overflow:hidden;
  box-shadow:0 -4px 0 0 var(--paper),0 4px 0 0 var(--paper),-4px 0 0 0 var(--paper),4px 0 0 0 var(--paper)}
.wallbar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.wallbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/7 - 3px),var(--night) calc(100%/7 - 3px) calc(100%/7))}
.meter{color:var(--ink);text-shadow:2px 2px 0 #fff6dc}
.meter small{color:var(--red)}
/* how everyone did: one bar per 500 m of wall */
.dist{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:4px solid var(--ink)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer;min-width:0}
.col i{display:block;width:100%;background:#6b5fb0}
.col.me i{background:var(--red)}
.col:focus-visible{outline:3px solid var(--jade);outline-offset:1px}
.you{font-family:var(--px);font-size:7px;line-height:1.2;color:var(--ink)}
.axis{display:flex;justify-content:space-between}
.pts.big{font-size:18px}
.lv{font-family:var(--px);font-size:8px;line-height:1.4;text-transform:uppercase;padding:4px 6px;white-space:nowrap;color:var(--paper);background:var(--dim)}
.lv.l2{background:#3f7d6a}.lv.l3{background:#2b6cb0}.lv.l4{background:#7b3fb3}.lv.l5{background:var(--red)}
.row .lv{margin-left:6px;font-size:7px;padding:2px 4px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.lbl.warn{color:#ff8a6e}
.field{display:flex;flex-direction:column;gap:8px}
.field input[type=text]{border-color:var(--gold)}
/* lantern string */
.garland{display:flex;justify-content:space-between;align-items:flex-start;border-top:4px solid #6b4a2b;padding:0 6px;height:76px}
.lan{padding-top:var(--h);background:linear-gradient(#6b4a2b,#6b4a2b) top center/3px var(--h) no-repeat;transform-origin:top center;animation:sway 1.6s steps(2,end) infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:4px dashed var(--gold);padding-bottom:12px}
/* pixel outline: four hard shadows make notched corners */
.panel{background:var(--paper);color:var(--ink);padding:18px;margin:4px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 10px 0 0 #0b0717}
.panel p{color:var(--dim)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seal{background:var(--gold);color:var(--ink);font-family:var(--px);font-size:9px;line-height:1.5;text-align:center;padding:8px;margin:3px;flex:none;max-width:96px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.score small{font-size:16px;text-shadow:none;color:var(--ink)}
.btn{font-family:var(--px);font-size:12px;line-height:1.6;text-transform:uppercase;color:var(--paper);background:var(--red);border:0;border-radius:0;
  padding:16px 12px 20px;margin:4px;width:calc(100% - 8px);cursor:pointer;
  box-shadow:0 -4px 0 0 var(--paper),0 4px 0 0 var(--paper),-4px 0 0 0 var(--paper),4px 0 0 0 var(--paper),inset 0 -6px 0 0 var(--redd)}
.panel .btn{box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -6px 0 0 var(--redd)}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:var(--tile);box-shadow:0 -4px 0 0 var(--soft),0 4px 0 0 var(--soft),-4px 0 0 0 var(--soft),4px 0 0 0 var(--soft),inset 0 -6px 0 0 var(--night)}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--jade);outline-offset:6px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:1.2;text-align:center;color:var(--soft)}
.tile{width:56px;height:56px;margin:3px;display:grid;place-items:center;background:var(--tile);flex:none;
  box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:2px dashed var(--edge);align-items:baseline}
.rules .lbl{flex:none}
.note{font-size:15px;color:var(--soft);border-left:4px solid var(--gold);padding-left:10px}
/* play */
.play{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center}
.secs{font-family:var(--px);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{height:16px;margin:4px;background:var(--tile);position:relative;overflow:hidden;
  box-shadow:0 -4px 0 0 var(--paper),0 4px 0 0 var(--paper),-4px 0 0 0 var(--paper),4px 0 0 0 var(--paper)}
.bar i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,var(--night) 10px 12px)}
.qcat{display:flex;align-items:center;gap:12px}
.chip{font-family:var(--px);font-size:9px;line-height:1.6;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:6px 8px}
.qpanel{margin-top:8px}
.qpanel h2{min-height:48px}
input[type=text]{width:100%;font:500 20px var(--body);padding:12px;border:4px solid var(--ink);border-radius:0;background:#fff;color:var(--ink)}
/* result */
.score{font-family:var(--px);font-size:52px;line-height:1.15;color:var(--red);text-shadow:4px 4px 0 var(--gold);font-variant-numeric:tabular-nums}
.rank{display:flex;justify-content:space-between;align-items:center;border-top:4px dashed var(--ink);padding-top:12px;gap:12px}
.rank strong{font-family:var(--px);font-size:10px;font-weight:400;line-height:1.6;text-align:right}
.sec{display:flex;flex-direction:column;gap:16px}
.sec>h3{color:var(--gold);border-bottom:4px dashed var(--gold);padding-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qa{padding:14px;gap:8px}
.qa .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qa .top strong{font-size:16px;line-height:1.3}
.pts{font-family:var(--px);font-size:10px;color:var(--red);flex:none}
.pts.zero{color:var(--dim)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 56px 24px;gap:8px;align-items:center;font-size:15px}
.row span:first-child{overflow-wrap:anywhere}
.row .m{height:8px;background:#e6d5b0;overflow:hidden}
.row .m i{display:block;height:100%;background:#c98f14}
.row.me{font-weight:700}.row.me .m i{background:var(--red)}
.row .n{font-family:var(--px);font-size:8px;text-align:right;color:var(--dim)}
.tag{font-family:var(--px);font-size:7px;line-height:1.4;background:var(--red);color:var(--paper);padding:3px 4px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.lb{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:2px dashed #cdbb9a;align-items:baseline}
.lb:last-child{border-bottom:0}
.lb .lbl{color:var(--red)}
.lb.me{font-weight:700}
.lb span:nth-child(2){overflow-wrap:anywhere}
.acts{display:flex;flex-direction:column;gap:12px}
@media (max-width:360px){.score{font-size:40px} h1{font-size:16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function norm(s){

    const m=new Map();

      const parts=entry.split("|"); let [name,note]=parts[0].split("@");
      name=name.trim(); const ok=!name.startsWith("!"); name=name.replace(/^!/,"").trim();
      const lv=name.match(/#([1-5])$/); if(lv) name=name.slice(0,-2).trim();
      const rec={name, note:(note||"").trim(), ok, lv: lv?+lv[1]:0};
      [name, ok?rec.note:"", ...parts.slice(1)].forEach(a=>{const k=norm(a); if(k && !m.has(k)) m.set(k,rec);});
    });
    return m;
  });
  const LEVEL = set.map((q,i)=>{  // answer name -> level 1..5
    const recs=[...new Set(INDEX[i].values())].filter(r=>r.ok), names=new Set(recs.map(r=>r.name)), m=new Map(), r=q.r||{};

    const min=/[^\x00-\x7f]/.test(k)?2:4;

function pixelText(text, size, color, scale, shadow){

  const x=c.getContext("2d");
  x.font=`700 ${size}px "PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Heiti SC",sans-serif`;
  x.textBaseline="middle"; x.textAlign="center";
  const draw=(col,dx,dy)=>{ x.fillStyle=col; chars.forEach((ch,i)=>x.fillText(ch,size*i+size/2+dx,size/2+1+dy)); };
  if(shadow) draw(shadow,1,1);
  draw(color,0,0);
  try{ const d=x.getImageData(0,0,c.width,c.height); for(let i=3;i<d.data.length;i+=4) d.data[i]=d.data[i]>110?255:0; x.putImageData(d,0,0); }catch(e){}
  c.style.cssText=`width:${c.width*scale}px;height:${c.height*scale}px;image-rendering:pixelated`;
  c.setAttribute("role","img"); c.setAttribute("aria-label",text);

}

function stamp(c,name,x0,y0){ SPR[name].forEach((row,y)=>[...row].forEach((ch,x)=>{ if(PAL[ch]){ c.fillStyle=PAL[ch]; c.fillRect(x0+x,y0+y,1,1); } })); }
function drawMilo(c,p,frame,busy){ // p = 0 to 7 (one per question); busy = powder is being added
  const W=120,H=76,px=(col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(x,y,w||1,h||1);};
  const f=Math.max(0,Math.min(p/7,1));
  px("#f3e3bd",0,0,W,H);                                                                    // kopitiam wall
  for(let x=0;x<W;x+=8) for(let y=28;y<52;y+=8) px(((x+y)/8)%2?"#2a9d8f":"#e6f2ea",x,y,8,8);   // green and white tiles
  px("#c9b48a",0,27,W,1);
  px("#16182b",6,5,30,17); px("#ffcc29",8,7,26,1); [10,13,16,19].forEach((y,i)=>px("#fff6dc",8,y,[18,22,14,20][i],1));   // menu board
  px("#efe9dc",0,52,W,6); px("#bdb5a4",0,58,W,2); px("#6b3e1f",0,60,W,H); px("#4f2c14",0,60,W,1);   // marble table
  stamp(c,"durian",6,43); stamp(c,"kuih",90,48);
  const gx=47,gy=10,gw=27,gh=41;                                                            // the glass
  px("#ffffff",gx,gy,gw,gh); px("#e8f1f6",gx+gw-5,gy,5,gh);
  const lh=4+Math.round(f*(gh-9)), top=gy+gh-lh;
  const mix=(a,b)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*f)).join(",")+")";
  px(mix([214,178,138],[66,35,15]),gx,top,gw,lh);                                           // the Milo: darker as it gets more gao
  px(mix([236,214,186],[120,78,44]),gx,top,gw,2);                                           // froth
  if(f<0.5){ px("rgba(255,255,255,.7)",gx+5,top+3,4,4); px("rgba(255,255,255,.7)",gx+15,top+5,4,4); }   // ice cubes when it's still thin
  if(f>=0.75){ for(let x=gx+2;x<gx+gw-2;x++) px("#3b1f0e",x,top-1-((x*7)%3?0:1),1,2); }     // Milo Dinosaur: powder on top
  px("rgba(255,255,255,.45)",gx+2,gy+2,2,gh-5);
  px("#9fb4c2",gx-1,gy,1,gh+1); px("#9fb4c2",gx+gw,gy,1,gh+1); px("#9fb4c2",gx-1,gy+gh,gw+2,1);   // glass outline
  px("#9fb4c2",gx+gw+1,gy+10,5,1); px("#9fb4c2",gx+gw+5,gy+10,1,16); px("#9fb4c2",gx+gw+1,gy+25,5,1);   // handle
  px("#fff6dc",gx-6,gy+gh+1,gw+12,2); px("#cdbb9a",gx-4,gy+gh+3,gw+8,1);                    // saucer
  for(let i=1;i<=7;i++){ const y=gy+gh-4-Math.round(i/7*(gh-9)); px(p>=i-1e-6?"#d62828":"#b9a98c",gx-7,y,4,1); }   // gao marks
  if(busy){ px("#8d95a3",gx+10,1,8,2); px("#8d95a3",gx+17,0,6,1);                           // a spoon, and powder falling in
    for(let i=0;i<6;i++) px("#5a3214",gx+9+((frame*2+i*3)%9), 4+((frame*3+i*5)%Math.max(3,top-6))); }
}
function wallScene(from,to){ // a picture of the Milo; it fills and darkens from "from" to "to"
  const cv=document.createElement("canvas"); cv.width=120; cv.height=76;
  cv.setAttribute("role","img"); cv.setAttribute("aria-label",`Your Milo is ${Math.round(to/7*100)} percent gao`);
  const c=cv.getContext("2d"), num=el("span",null,""), scoops=Math.round((to-from)*5);
  const meter=el("div",{class:"meter","aria-hidden":"true"},num,scoops>0?el("small",null,"+"+scoops+(scoops===1?" scoop":" scoops")):null);
  const fill=el("i"), bar=el("div",{class:"wallbar","aria-hidden":"true"},fill);
  const show=(p,frame,busy)=>{ drawMilo(c,p,frame,busy); num.textContent=Math.round(p/7*100)+"% gao"; fill.style.transform=`scaleX(${p/7})`; };
  const still=from===to||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  if(still) show(to,0,false);
  else{ const t0=performance.now()+350, dur=900+1600*Math.abs(to-from); let last=-1;
    const tick=now=>{ if(!cv.isConnected&&now-t0>400) return;
      const k=Math.max(0,Math.min((now-t0)/dur,1)), fr=Math.floor(Math.max(0,now-t0)/110);
      if(fr!==last||k===1){ last=fr; show(from+(to-from)*k,k===1?0:fr,k>0&&k<1); }
      if(k<1) requestAnimationFrame(tick); };
    show(from,0,false); requestAnimationFrame(tick); }
  return el("div",{class:"wallwrap"},el("div",{class:"scene"},cv,meter),bar);
}

// ---- Background music: an original festive loop, made by the browser (no audio file). ----
const Music=(()=>{
  const F={F2:87.31,G2:98,A2:110,C3:130.81,D3:146.83,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,C6:1046.5};
  const LEAD=["C5 E5 G5 E5 C5 E5 G5 -","A5 G5 F5 E5 D5 - D5 -","D5 F5 A5 F5 D5 F5 A5 -","G5 F5 E5 D5 C5 - C5 -",
              "E5 E5 G5 G5 A5 A5 G5 -","F5 F5 A5 A5 G5 - E5 -","D5 E5 F5 G5 A5 G5 F5 D5","C5 - E5 - C5 - - -"].join(" ").split(" ");
  const BASS=["C3","G2","D3","G2","C3","F2","G2","C3"], E=0.17;
  let ac=null,out=null,noise=null,id=null,step=0,nextT=0;
  function tone(f,t,d,type,v){ const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+0.02); }
  function tick(t){ const g=ac.createGain(),s=ac.createBufferSource(),hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000;
    s.buffer=noise; g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05); s.connect(hp); hp.connect(g); g.connect(out); s.start(t); s.stop(t+0.06); }
  function plan(){ while(nextT<ac.currentTime+0.3){ const n=LEAD[step], bar=Math.floor(step/8), beat=step%8;
      if(n!=="-"){ tone(F[n],nextT,E*0.95,"square",0.10); tone(F[n]/2,nextT,E*0.6,"square",0.03); }
      if(beat%4===0) tone(F[BASS[bar]],nextT,E*1.8,"triangle",0.22);
      if(beat%2===1) tick(nextT);
      nextT+=E; step=(step+1)%LEAD.length; } }
  return {
    start(){ try{
        if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ac=new AC();
          out=ac.createGain(); out.gain.value=0.5; out.connect(ac.destination);
          noise=ac.createBuffer(1,2205,22050); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
        ac.resume(); if(id) return; nextT=ac.currentTime+0.06; id=setInterval(plan,60); }catch(e){} },
    stop(){ try{ if(id){ clearInterval(id); id=null; } if(ac) ac.suspend(); }catch(e){} },
    sfx(level){ try{ if(!ac||ac.state!=="running") return; const t=ac.currentTime+0.02;   // one rising note per rarity level
        if(!level){ tone(F.A2,t,0.25,"square",0.12); return; }
        ["C5","E5","G5","A5","C6"].slice(0,level).forEach((n,i)=>tone(F[n],t+i*0.09,0.16,"square",0.12)); }catch(e){} }
  };
})();

function streak(){ // current streak (0 if a day was missed)
  try{ const s=JSON.parse(localStorage.getItem("zomo-streak")||"null"); if(!s) return 0;
    return (s.last===DAY || s.last===sgDate(Date.now()-86400000)) ? s.n : 0; }catch(e){ return 0; }
}
function bumpStreak(){
  try{ const s=JSON.parse(localStorage.getItem("zomo-streak")||"null")||{last:"",n:0};
    if(s.last===DAY) return;
    const n= s.last===sgDate(Date.now()-86400000) ? s.n+1 : 1;
    localStorage.setItem("zomo-streak",JSON.stringify({last:DAY,n})); }catch(e){}
}
function shareText(mine,pct,title){ // a spoiler-free result to paste anywhere
  const sq=["⬛","⬜","🟩","🟦","🟪","🟥"];
  const squares=mine.a.map((a,i)=>sq[a?levelOf(i,a):0]).join("");
  const url=location.protocol.startsWith("http") ? location.origin+location.pathname : "";
  const st=streak();
  return `Zomokrillion · Day ${DAYNUM}\n🥤 My Milo is ${pct}% gao (${title})\n${squares}`+(st>1?`\n🔥 ${st}-day streak`:"")+(url?`\n${url}`:"");
}
function finish(){
  S.mine={v:2,day:DAY,a:S.a.slice(),raw:S.raw.slice(),t:Date.now(),name:S.nick.trim().slice(0,20)||"Player"};
  try{ localStorage.setItem(LS,JSON.stringify(S.mine)); }catch(e){}
  bumpStreak();
  S.screen="result"; render(); save();
}
async function save(){ // put my play on the shared scoreboard
  if(!S.mine||S.saved||S.saving) return;
  S.saving=true;
  try{
    const r=await fetch(SB_URL+"/rest/v1/plays",{method:"POST",headers:{...HEAD,Prefer:"return=minimal"},
      body:JSON.stringify({day:DBDAY,player:S.uid,nickname:S.mine.name||"Player",answers:S.mine.a})});
    if(r.ok||r.status===409){ S.saved=true; S.saveFailed=false; sendMisses(); }   // 409 = already saved
    else S.saveFailed=true;
  }catch(e){ S.saveFailed=true; }
  S.saving=false;
  if(S.saved) load(); else if(S.screen==="result") render();
}
function sendMisses(){ // answers the list didn't know go to a private table for the owner
  try{ if(localStorage.getItem(LS+"-misses")) return; localStorage.setItem(LS+"-misses","1"); }catch(e){}
  const rows=(S.mine.raw||[]).map((r,i)=>r?{day:DBDAY,question:i+1,answer:String(r).slice(0,50)}:null).filter(Boolean);
  if(rows.length) fetch(SB_URL+"/rest/v1/misses",{method:"POST",headers:{...HEAD,Prefer:"return=minimal"},body:JSON.stringify(rows)}).catch(()=>{});
}
async function load(){ // read everyone's plays for today
  let sig=S.sig;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/plays?day=eq.${DBDAY}&select=player,nickname,answers,created_at&order=created_at.asc&limit=1000`,{headers:HEAD});
    if(!r.ok) throw new Error("load failed");
    const rows=await r.json(), m=new Map();
    rows.forEach(v=>{
      if(!v||!Array.isArray(v.answers)||v.answers.length!==Q.length) return;
      m.set(String(v.player),{a:v.answers.map((x,i)=>typeof x==="string"&&OKSET[i].has(x)?x:""),raw:[],
        t:Date.parse(v.created_at)||0,name:String(v.nickname||"").slice(0,20)});
    });
    S.plays=m; S.online=true;
    if(m.has(S.uid)){ S.saved=true; S.saveFailed=false; if(!S.mine) S.mine={day:DAY,...m.get(S.uid)}; }
    else if(S.mine) save();
    sig="on:"+[...m.keys()].join(",")+":"+S.saved;
  }catch(e){ S.online=false; sig="off"; }
  const first=!S.tried; S.tried=true;
  if((first||sig!==S.sig) && (S.screen==="home"||S.screen==="result")) { S.sig=sig; render(); }   // never interrupt a question
  S.sig=sig;
}

function distChart(rows,me){ // how gao everyone's Milo is (one bar per 10%)
  const B=10, counts=Array(B).fill(0), n=rows.length;
  let mine=-1, my=0;
  rows.forEach(r=>{ const k=Math.min(B-1,Math.floor(r.score/10)); counts[k]++; if(r.id===me){ mine=k; my=r.score; } });
  const max=Math.max(...counts,1), beaten=rows.filter(r=>r.id!==me&&r.score<my).length;
  const label=k=>`${k*10}% to ${k===B-1?100:k*10+9}% gao: ${counts[k]} ${counts[k]===1?"player":"players"}`+(k===mine?" (you are here)":"");
  const info=el("p",{class:"lbl","aria-live":"polite"},`Tallest bar: ${max} ${max===1?"player":"players"}. Tap a bar for details`);
  const cols=counts.map((c,k)=>{
    const col=el("div",{class:"col"+(k===mine?" me":""),tabindex:"0",role:"img","aria-label":label(k)},
      k===mine?el("span",{class:"you"},"YOU"):null, el("i",{style:`height:${c?Math.max(8,Math.round(c/max*82)):0}%`}));
    const show=()=>{ info.textContent=label(k); };
    col.addEventListener("pointerenter",show); col.addEventListener("focus",show); col.addEventListener("click",show);
    return col; });
  const line= n<2 ? "You're the first player today. This chart fills in as friends play."
                  : `Your Milo is more gao than ${beaten} of the ${n-1} other ${n-1===1?"player's":"players'"}.`;
  return el("section",{class:"sec"},
    el("h3",null,el("span",null,"How everyone did"),el("span",{class:"lbl gold"},`${n} ${n===1?"player":"players"}`)),
    el("div",{class:"panel qa"},el("p",{style:"font-size:15px"},line),
      el("div",{class:"dist"},cols),
      el("div",{class:"axis"},el("span",{class:"lbl"},"0%"),el("span",{class:"lbl"},"50%"),el("span",{class:"lbl"},"100% gao")),
      info));
}

function viewResult(){
  const plays=allPlays(), {counts,rows}=compute(plays), me=myId();
  const idx=rows.findIndex(r=>r.id===me), row=rows[idx], mine=plays.find(p=>p.id===me);
  const t=tierOf(row.score), n=rows.length, pts=row.score*Q.length, pct=gaoPct(pts);
  const rankText= n>1 ? `No. ${idx+1} of ${n}` : "First player in";
  const out=[ mast("Day "+DAYNUM),
    wallScene(pts/100,pts/100),
    el("section",{class:"panel"},
      el("div",{class:"row2"},el("span",{class:"lbl"},"My Milo is"),seal(t[2])),
      el("div",{class:"score"},pct+"%",el("small",null," gao")),
      el("h2",null,t[1]),
      el("p",null,t[3]),
      el("div",{class:"rank"},el("span",{class:"lbl"},"Milo powder"),el("strong",null,`${scoopsOf(pts)} of 35 scoops`)),
      el("div",{class:"rank"},el("span",{class:"lbl"},"Today's rank"),el("strong",null,rankText)),
      streak()>0?el("div",{class:"rank"},el("span",{class:"lbl"},"Streak"),el("strong",null,`${streak()} ${streak()===1?"day":"days"} in a row`)):null),
    el("p",{class:"note"},"Every answer has a rarity level from 1 (Tourist) to 5 (Legend), worth 1 to 5 scoops. The levels are hand-set estimates of how well known each answer is."),
    (me===LOCAL_ID && S.tried && (S.saveFailed||!S.online)) ?
      el("p",{class:"note"},"Your score isn't on the leaderboard yet. Keep this page open; it will try again by itself.") : null,
    el("div",{class:"acts"},
      el("button",{class:"btn",id:"copy",onclick:async e=>{
        const txt=shareText(mine,pct,t[1]), b=e.currentTarget;
        try{ if(navigator.share){ await navigator.share({text:txt}); return; } }catch(err){ if(err&&err.name==="AbortError") return; }
        try{ await navigator.clipboard.writeText(txt); b.textContent="Copied! Paste it anywhere"; }
        catch(err){ b.textContent="Couldn't copy. Screenshot instead"; }
      }},"Share my result"),
      el("p",{class:"lbl soft center"},"Want an image? Screenshot the card"))
  ];
  out.push(distChart(rows,me));
  // The reveal
  const sec=el("section",{class:"sec"},el("h3",null,el("span",null,"The reveal"),el("span",{class:"lbl gold"},"Jawapan")));
  Q.forEach((q,i)=>{
    const my=mine.a[i], rawMine=mine.raw&&mine.raw[i];
    const list=[...counts[i].entries()].sort((x,y)=>y[1]-x[1]), max=list[0]?list[0][1]:1;
    let line;
    if(my) line=`Your answer: ${my}`;
    else if(rawMine){ const r=match(i,rawMine); line= r&&!r.ok ? `Your answer: ${r.name}. Sorry, ${r.note}.` : `Your answer "${rawMine}" isn't on the answer list.`; }
    else line="No answer.";
    const sc=row.per[i]/20;
    const box=el("div",{class:"panel qa"},
      el("div",{class:"top"},el("strong",null,`${pad(i+1)} ${q.p}`),
        el("span",{class:"pts"+(row.per[i]?"":" zero")},"+"+sc)),
      el("p",{style:"font-size:15px"},line));
    let shown=list.slice(0,6); const mi=list.findIndex(x=>x[0]===my);
    if(mi>=6) shown=[...list.slice(0,5),list[mi]];
    shown.forEach(([name,c])=>{
      const rec=INDEX[i].get(norm(name));
      const note=rec&&rec.note&&norm(rec.note)!==norm(name)?` (${rec.note})`:"";
      box.append(el("div",{class:"row"+(name===my?" me":"")},
        el("span",null,name+note,el("span",{class:"lv l"+levelOf(i,name)},LEVELS[levelOf(i,name)])),
        el("span",{class:"m"},el("i",{style:`width:${Math.round(c/max*100)}%`})),
        el("span",{class:"n"},c)));
    });
    if(list.length>shown.length) box.append(el("p",{class:"lbl"},`+ ${list.length-shown.length} more answers`));
    sec.append(box);
  });
  out.push(sec);
  // Leaderboard
  const board=el("div",{class:"panel qa"});
  rows.slice(0,10).forEach((r,k)=>board.append(el("div",{class:"lb"+(r.id===me?" me":"")},
    el("span",{class:"lbl"},pad(k+1)),
    el("span",null,r.id===me?((S.mine.name||"Me")+" (you)"):((S.plays.get(r.id)||{}).name||"Player "+(k+1))),
    el("span",{class:"lbl"},gaoPct(r.score*Q.length)+"%"))));
  out.push(el("section",{class:"sec"},el("h3",null,el("span",null,"Leaderboard"),el("span",{class:"lbl gold"},`${n} ${n===1?"player":"players"}`)),board));
  out.push(el("button",{class:"btn ghost",onclick:()=>{S.screen="home";render();}},"Back to the start"));
  return out;
}

function valid(d){ return d&&d.day===DAY&&Array.isArray(d.a)&&d.a.length===Q.length; }

function start(){
  stars();
  try{ const m=JSON.parse(localStorage.getItem(LS)||"null"); if(valid(m)) S.mine=m; }catch(e){}
  try{ S.nick=localStorage.getItem("china-index-nick")||""; S.music=localStorage.getItem("china-index-music")!=="off"; }catch(e){}
  document.addEventListener("pointerdown",e=>{ if(S.music && !(e.target&&e.target.id==="mus")) Music.start(); },{once:true});   // browsers only allow sound after a tap
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) Music.stop(); else if(S.music) Music.start(); });
  S.uid=playerId();
  render(); load();
  setInterval(()=>{
    if(sgDate(Date.now())!==DAY && (S.screen==="home"||S.screen==="result")){ location.reload(); return; }   // a new day has started
    if(S.screen!=="play" && !document.hidden) load();
  }, 20000);   // refresh the scores every 20 seconds
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.screen!=="play") load(); });
}
start();
}
</script>
